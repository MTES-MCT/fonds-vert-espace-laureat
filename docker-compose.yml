services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vert_impact
      POSTGRES_USER: vert_impact
      POSTGRES_PASSWORD: vert_impact
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vert_impact -d vert_impact"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
