name: Playwright
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Use canonical npm version
        run: npm install --global npm@11.16.0
      - name: Install dependencies
        run: npm ci
      - name: Check OpenAPI generated types
        run: npm run check:corrections
      - name: Install Playwright Browsers
        run: npm exec -- playwright install --with-deps
      - name: Run Playwright tests
        run: npm run test
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/e2e
      - name: Run isolated corrections HTTP API tests
        run: npm run test:corrections-api
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/corrections-api
      - name: Verify revoked machine key on a fresh server
        run: npx dotenv -e tests/fixtures/corrections-api.env -- env -u CORRECTIONS_API_PREVIOUS_KEY CORRECTIONS_TEST_PROFILE=revoked npm run test:e2e -- tests/corrections-api.spec.ts --workers=1 --grep "HTTP configuration"
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/revoked-key
      - name: Verify incomplete and invalid configuration on fresh servers
        run: |
          npx dotenv -e tests/fixtures/corrections-api.env -- env -u CORRECTIONS_API_KEY CORRECTIONS_TEST_PROFILE=closed PLAYWRIGHT_HTML_OUTPUT_DIR=playwright-report/missing-key npm run test:e2e -- tests/corrections-api.spec.ts --workers=1 --grep "HTTP configuration"
          npx dotenv -e tests/fixtures/corrections-api.env -- env CORRECTIONS_INGRESS_VERIFIED=false CORRECTIONS_TEST_PROFILE=closed PLAYWRIGHT_HTML_OUTPUT_DIR=playwright-report/unverified-ingress npm run test:e2e -- tests/corrections-api.spec.ts --workers=1 --grep "HTTP configuration"
          npx dotenv -e tests/fixtures/corrections-api.env -- env CORRECTIONS_ALLOWED_IPS=invalid CORRECTIONS_TEST_PROFILE=closed PLAYWRIGHT_HTML_OUTPUT_DIR=playwright-report/invalid-ips npm run test:e2e -- tests/corrections-api.spec.ts --workers=1 --grep "HTTP configuration"
      - name: Check TypeScript
        run: npx tsc --noEmit
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
